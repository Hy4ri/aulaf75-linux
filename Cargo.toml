[package]
name = "aulaf75-linux"
version = "0.1.0"
edition = "2021"
description = "Native Linux GUI & HID driver for AULA F75 mechanical keyboard"

[dependencies]
gpui = "0.2.2"
hidapi = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
